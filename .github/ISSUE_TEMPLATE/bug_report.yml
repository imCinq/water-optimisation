name: Bug report
description: Report a reproducible rendering, compatibility, or diagnostics problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include account identifiers, server logs, credentials, or private screenshots.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the visible problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the scene, blocks, settings, and exact steps.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Minecraft, Fabric Loader, mod version, Java, Sodium, and renderer backend.
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Measurements
      description: Include frame-time or diagnostic data when available.
