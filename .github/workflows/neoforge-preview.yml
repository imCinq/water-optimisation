name: neoforge-26.3-preview

on:
  workflow_dispatch:
    inputs:
      neo_version:
        description: Published NeoForge 26.3 runtime version to build against
        required: true
        type: string
      neo_version_range:
        description: NeoForge dependency range for generated metadata
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run repository privacy audit
        run: bash scripts/audit-repository.sh
      - name: Run client-only boundary audit
        run: bash scripts/audit-client-only.sh
      - name: Build and verify NeoForge preview
        run: >-
          ./gradlew -p neoforge-26.3 clean test build verifyArtifact
          -Pneo_version_override="${{ inputs.neo_version }}"
          -Pneo_version_range_override="${{ inputs.neo_version_range }}"
          --no-daemon --console=plain
      - name: Capture NeoForge preview artifacts
        uses: actions/upload-artifact@v7
        with:
          name: water-optimisation-neoforge-26.3-preview
          path: neoforge-26.3/build/libs/
          if-no-files-found: error
