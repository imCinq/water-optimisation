# Build and verify every push and pull request without committing generated output.
name: build

on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run repository privacy audit
        run: bash scripts/audit-repository.sh
      - name: Run client-only boundary audit
        run: bash scripts/audit-client-only.sh
      - name: Build and test
        run: ./gradlew test build
      - name: Capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: water-optimisation-artifacts
          path: build/libs/
