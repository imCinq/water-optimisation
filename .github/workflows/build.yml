# Build and verify every push and pull request without committing generated output.
name: build

on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 26.2
            java: '25'
          - target: 1.21.1
            java: '21'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run repository privacy audit
        run: bash scripts/audit-repository.sh
      - name: Run client-only boundary audit
        run: bash scripts/audit-client-only.sh
      - name: Build and test
        run: ./gradlew -Ptarget_minecraft=${{ matrix.target }} -Pminecraft_version=${{ matrix.target }} test build
      - name: Capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: water-optimisation-${{ matrix.target }}-artifacts
          path: build/libs/
