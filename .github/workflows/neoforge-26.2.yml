name: neoforge-26.2

on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build and test NeoForge 26.2
        run: ./gradlew -p neoforge-26.2 test build --no-daemon --console=plain
      - name: Capture NeoForge artifact
        uses: actions/upload-artifact@v7
        with:
          name: water-optimisation-26.2-neoforge-artifacts
          path: neoforge-26.2/build/libs/
