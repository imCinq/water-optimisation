name: production-smoke

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 26.2
            java: '25'
          - target: 1.21.1
            java: '21'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run repository privacy audit
        run: bash scripts/audit-repository.sh
      - name: Run client-only boundary audit
        run: bash scripts/audit-client-only.sh
      - name: Update package lists
        run: sudo apt-get update
      - name: Install headless display support
        run: sudo apt-get install --yes xvfb
      - name: Run exact-artifact production startup smoke
        env:
          PRODUCTION_SMOKE_TIMEOUT_SECONDS: '300'
          PRODUCTION_SMOKE_USE_XVFB: 'true'
        run: bash scripts/smoke-production-client.sh '${{ matrix.target }}'
      - name: Capture production smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: water-optimisation-${{ matrix.target }}-production-smoke
          path: build/production-smoke/
          if-no-files-found: ignore
