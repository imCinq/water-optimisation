plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

def targetMinecraft = providers.gradleProperty("target_minecraft").orElse("26.2").get()
def legacyTarget = targetMinecraft == "1.21.1"
if (!legacyTarget && targetMinecraft != "26.2") {
	throw new GradleException("Unsupported target_minecraft '${targetMinecraft}'. Use 26.2 or 1.21.1.")
}

def targetMinecraftVersion = legacyTarget ? project.minecraft_version_1211 : project.minecraft_version
def targetLoaderVersion = legacyTarget ? project.loader_version_1211 : project.loader_version
def targetFabricApiVersion = legacyTarget ? project.fabric_api_version_1211 : project.fabric_api_version
def targetModMenuVersion = legacyTarget ? project.modmenu_version_1211 : project.modmenu_version
def targetJavaVersion = legacyTarget ? 21 : 25
def targetDescription = legacyTarget
		? "Client-side water rendering optimisation for Minecraft 1.21.1 with conservative geometry culling, particle filtering, and diagnostics."
		: "Client-side water rendering optimisation for Minecraft 26.2 with conservative geometry culling, particle filtering, and diagnostics."
def sodiumMixinEntry = legacyTarget ? "" : """,
		{
			"config": "wateroptimisation.sodium.mixins.json",
			"environment": "client"
		}"""
def clientMixinEntry = """{
			"config": "${legacyTarget ? "wateroptimisation.legacy.mixins.json" : "wateroptimisation.client.mixins.json"}",
			"environment": "client"
		}${sodiumMixinEntry}"""

def resourceExpansion = [
	version: project.version,
	target_description: targetDescription,
	loader_dependency: ">=${targetLoaderVersion}",
	minecraft_dependency: "~${targetMinecraftVersion}",
	java_dependency: ">=${targetJavaVersion}",
	modmenu_dependency: ">=${targetModMenuVersion}",
	client_mixin_entry: clientMixinEntry,
	java_compatibility_level: "JAVA_${targetJavaVersion}",
	mixin_default_require: legacyTarget ? 0 : 1
]

repositories {
	// Loom provides the repositories needed for Minecraft and Fabric dependencies.
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"wateroptimisation" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// The two Minecraft lines have incompatible client APIs. Keep the source
// variants separate so a target can never accidentally load the other line's
// GUI or renderer classes.
sourceSets.client.java.setSrcDirs(legacyTarget
		? ["src/1.21.1/client/java"]
		: ["src/client/java"])

dependencies {
	minecraft "com.mojang:minecraft:${targetMinecraftVersion}"
	if (legacyTarget) {
		mappings loom.officialMojangMappings()
	}
	implementation "net.fabricmc:fabric-loader:${targetLoaderVersion}"
	implementation "net.fabricmc.fabric-api:fabric-api:${targetFabricApiVersion}"
	compileOnly "com.terraformersmc:modmenu:${targetModMenuVersion}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"
}

processResources {
	inputs.properties(resourceExpansion)

	filesMatching("fabric.mod.json") {
		expand resourceExpansion
	}
	filesMatching("wateroptimisation.client.mixins.json") {
		expand resourceExpansion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = targetJavaVersion
}

tasks.test {
	useJUnitPlatform()
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
	targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Publishing is intentionally not configured for this project.
	}
}
