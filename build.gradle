plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'maven-publish'
}

def targetMinecraft = providers.gradleProperty("target_minecraft").orElse("26.2").get()
def targetProfiles = ["26.2": "", "1.21.1": "_1211", "26.3": "_263"]
if (!targetProfiles.containsKey(targetMinecraft)) {
	throw new GradleException("Unsupported target_minecraft '${targetMinecraft}'. Use 26.2, 1.21.1 or 26.3.")
}
def legacyTarget = targetMinecraft == "1.21.1"
def target263 = targetMinecraft == "26.3"
def propertySuffix = targetProfiles[targetMinecraft]
apply plugin: legacyTarget ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

// Keep each target's outputs and version separate per target.
if (target263) {
	layout.buildDirectory = layout.projectDirectory.dir("build/26.3")
	version = project.version_263
	base.archivesName = "water-optimisation"
}
def targetMinecraftVersion = project.property("minecraft_version${propertySuffix}")
def targetLoaderVersion = project.property("loader_version${propertySuffix}")
def targetFabricApiVersion = project.property("fabric_api_version${propertySuffix}")
def targetModMenuVersion = project.property("modmenu_version${propertySuffix}")
def targetJavaVersion = legacyTarget ? 21 : 25
def modDependencyConfiguration = legacyTarget ? "modImplementation" : "implementation"
def modCompileOnlyConfiguration = legacyTarget ? "modCompileOnly" : "compileOnly"
def targetDescription = "Client-side water rendering optimisation for Minecraft ${targetMinecraftVersion} with conservative geometry culling, particle filtering, and diagnostics."
def clientMixinConfig = legacyTarget ? "wateroptimisation.legacy.mixins.json" : "wateroptimisation.client.mixins.json"

def resourceExpansion = [
	version: project.version,
	target_description: targetDescription,
	loader_dependency: ">=${targetLoaderVersion}",
	fabric_api_dependency: target263 ? ">=${targetFabricApiVersion}" : "*",
	minecraft_dependency: target263 ? "${targetMinecraftVersion}" : "~${targetMinecraftVersion}",
	java_dependency: ">=${targetJavaVersion}",
	modmenu_dependency: ">=${targetModMenuVersion}",
	client_mixin_config: clientMixinConfig,
	java_compatibility_level: "JAVA_${targetJavaVersion}",
	mixin_default_require: legacyTarget ? 0 : 1
]

repositories {
	// Loom provides the repositories needed for Minecraft and Fabric dependencies.
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"wateroptimisation" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Modern renderer/UI code is shared; only the input adapter differs after SDL.
// The legacy client remains entirely isolated.
sourceSets.client.java.setSrcDirs(legacyTarget
		? ["src/1.21.1/client/java"]
		: ["src/client/java", "src/${targetMinecraft}/client/java"])

if (target263) {
	tasks.withType(Jar).configureEach {
		archiveVersion = "${project.version}-mc26.3-fabric"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${targetMinecraftVersion}"
	if (legacyTarget) {
		mappings loom.officialMojangMappings()
	}
	add(modDependencyConfiguration, "net.fabricmc:fabric-loader:${targetLoaderVersion}")
	add(modDependencyConfiguration, "net.fabricmc.fabric-api:fabric-api:${targetFabricApiVersion}")
	// ProductionRunTask does not infer implementation dependencies. Keep the
	// matching Fabric API in the exact production client classpath as well.
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${targetFabricApiVersion}"
	add(modCompileOnlyConfiguration, "com.terraformersmc:modmenu:${targetModMenuVersion}")
	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testImplementation "org.mockito:mockito-core:5.18.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"
}

processResources {
	inputs.properties(resourceExpansion)

	filesMatching("fabric.mod.json") {
		expand resourceExpansion
	}
	filesMatching("wateroptimisation.client.mixins.json") {
		expand resourceExpansion
	}
	// Only ship the descriptor used by this target.
	exclude legacyTarget ? "wateroptimisation.client.mixins.json" : "wateroptimisation.legacy.mixins.json"
}

// Validate the distributed artifact, not just the unexpanded source template.
tasks.register("verifyArtifact") {
	group = "verification"
	def runtimeJar = tasks.named(legacyTarget ? "remapJar" : "jar")
	dependsOn runtimeJar
	inputs.file(runtimeJar.flatMap { it.archiveFile })
	doLast {
		def archive = runtimeJar.get().archiveFile.get().asFile
		new java.util.zip.ZipFile(archive).withCloseable { zip ->
			def json = new groovy.json.JsonSlurper()
			def metadata = json.parse(zip.getInputStream(zip.getEntry("fabric.mod.json")))
			assert metadata.id == "wateroptimisation"
			assert metadata.version == project.version.toString()
			assert metadata.environment == "client"
			assert metadata.depends.minecraft == resourceExpansion.minecraft_dependency
			assert metadata.depends.fabricloader == resourceExpansion.loader_dependency
			assert metadata.depends['fabric-api'] == resourceExpansion.fabric_api_dependency
			assert metadata.depends.java == resourceExpansion.java_dependency
			assert metadata.mixins*.config == [clientMixinConfig]
			assert metadata.entrypoints.keySet() == ["client", "modmenu"] as Set
			assert zip.getEntry("assets/wateroptimisation/icon.png") != null
			def mixins = json.parse(zip.getInputStream(zip.getEntry(clientMixinConfig)))
			assert mixins.compatibilityLevel == "JAVA_${targetJavaVersion}"
			mixins.client.each { name ->
				assert zip.getEntry("${mixins.package.replace('.', '/')}/${name}.class") != null
			}
			assert zip.getEntry(legacyTarget ? "wateroptimisation.client.mixins.json" : "wateroptimisation.legacy.mixins.json") == null
			assert (zip.getEntry("io/github/imcinq/wateroptimisation/KeyboardInput.class") != null) == !legacyTarget
		}
		logger.lifecycle("Verified ${archive.name}: Minecraft ${targetMinecraftVersion}, Java ${targetJavaVersion}, client-only.")
	}
}
tasks.named("check") { dependsOn "verifyArtifact" }

tasks.withType(JavaCompile).configureEach {
	it.options.release = targetJavaVersion
}

// The mocked block fixture targets the modern Fabric Minecraft API only.
if (legacyTarget) {
	sourceSets.test.java.exclude('**/FluidOptimizationPolicyTest.java')
}

tasks.test {
	useJUnitPlatform()
}

// Loom's production client task launches the same remapped (or, for the
// no-remap 26.2 profile, ordinary) runtime JAR that is distributed to users.
// It is intentionally opt-in: the smoke script supplies a bounded lifetime
// and watches for the mod's initialization marker before stopping the client.
def productionRunDir = providers.gradleProperty("production_run_dir")
def productionUseXvfb = providers.gradleProperty("production_use_xvfb")
		.map { it.toBoolean() }
		.orElse(false)

tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = "verification"
	description = "Launch the exact production client artifact until the startup smoke marker is observed."
	useXVFB.set(productionUseXvfb)
	if (productionRunDir.isPresent()) {
		runDir.set(project.file(productionRunDir.get()))
	} else {
		runDir.set(layout.buildDirectory.dir("production-run/${targetMinecraft}"))
	}
	doFirst {
		logger.lifecycle("Production client mod inputs: ${mods.files.collect { it.name }.join(', ')}")
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
	targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Publishing is intentionally not configured for this project.
	}
}
