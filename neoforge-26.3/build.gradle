plugins {
    id 'java-library'
    id 'maven-publish'
    // Keep this preview pinned to the ModDevGradle line used by NeoForge's
    // official 26.3.x development branch.
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

version = mod_version
group = mod_group_id

def neoVersion = providers.gradleProperty('neo_version_override').orElse(project.neo_version).get()
def neoVersionRange = providers.gradleProperty('neo_version_range_override').orElse(project.neo_version_range).get()

repositories {
    // The 26.3 preview is normally consumed from a local publication built
    // from NeoForge's 26.3.x development branch. Keep the official release
    // repository available for the eventual stable coordinate as well.
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

base {
    archivesName = "water-optimisation-neoforge-${minecraft_version}"
}

// Minecraft 26.3 ships with Java 25, so the NeoForge preview uses Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        java {
            srcDir('../src/main/java')
        }
        resources {
            // Reuse only shared assets and translations; Fabric metadata/mixin
            // descriptors are excluded from the NeoForge jar below.
            srcDir('../src/main/resources')
            exclude('fabric.mod.json')
            exclude('wateroptimisation.client.mixins.json')
            exclude('wateroptimisation.legacy.mixins.json')
        }
    }
    test {
        java.srcDir('../src/test/java')
        // This mocked fixture targets the modern Fabric test environment.
        java.exclude('**/FluidOptimizationPolicyTest.java')
    }
    // Empty source set used by CI to launch Minecraft with only the packaged
    // runtime jar on the mod classpath. This catches packaging differences
    // that the normal development source-set run cannot see.
    packagedSmoke
}

sourceSets.main.resources.srcDir('src/generated/resources')

neoForge {
    version = neoVersion

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        packagedClient {
            client()
            sourceSet = sourceSets.packagedSmoke
            loadedMods = []
            systemProperty 'wateroptimisation.verifyMixins', 'true'
        }
        packagedServer {
            server()
            sourceSet = sourceSets.packagedSmoke
            loadedMods = []
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

neoForge.addModdingDependenciesTo sourceSets.packagedSmoke

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'com.google.code.gson:gson:2.14.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    packagedSmokeRuntimeOnly files(tasks.named('jar'))
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version_range      : neoVersionRange,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

jar {
    from('../LICENSE') {
        rename { 'LICENSE_water-optimisation-neoforge-26.3' }
    }
}

tasks.test {
    useJUnitPlatform()
}

tasks.register('verifyArtifact') {
    group = 'verification'
    description = 'Verify the NeoForge 26.3 runtime JAR contains the expected client metadata and mixins.'
    def runtimeJar = tasks.named('jar')
    dependsOn runtimeJar
    inputs.file(runtimeJar.flatMap { it.archiveFile })
    doLast {
        def archive = runtimeJar.get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def packMetadataEntry = zip.getEntry('pack.mcmeta')
            assert packMetadataEntry != null
            def packMetadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(packMetadataEntry))
            assert packMetadata.pack.min_format == [97, 1]
            assert packMetadata.pack.max_format == [97, 1]
            def metadataEntry = zip.getEntry('META-INF/neoforge.mods.toml')
            assert metadataEntry != null
            def metadata = zip.getInputStream(metadataEntry).getText('UTF-8')
            assert metadata.contains('modId="wateroptimisation"')
            assert metadata.contains("version=\"${mod_version}\"")
            assert metadata.contains('modId="neoforge"')
            assert metadata.contains("versionRange=\"${neoVersionRange}\"")
            assert metadata.contains("versionRange=\"${minecraft_version_range}\"")

            assert zip.getEntry('wateroptimisation.neoforge.mixins.json') != null
            assert zip.getEntry('fabric.mod.json') == null
            assert zip.getEntry('wateroptimisation.client.mixins.json') == null
            assert zip.getEntry('wateroptimisation.legacy.mixins.json') == null
            assert zip.getEntry('assets/wateroptimisation/icon.png') != null
            assert zip.getEntry('LICENSE_water-optimisation-neoforge-26.3') != null

            [
                    'io/github/imcinq/wateroptimisation/mixin/client/ClientLevelMixin.class',
                    'io/github/imcinq/wateroptimisation/mixin/client/FluidRendererMixin.class',
                    'io/github/imcinq/wateroptimisation/mixin/client/SectionCompilerMixin.class',
                    'io/github/imcinq/wateroptimisation/mixin/client/ResortTransparencyTaskMixin.class'
            ].each { classPath ->
                assert zip.getEntry(classPath) != null
            }
        }
        logger.lifecycle("Verified ${archive.name}: NeoForge ${minecraft_version}, client-only preview artifact.")
    }
}

tasks.named('check') {
    dependsOn 'verifyArtifact'
}
