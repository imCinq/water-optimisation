org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# The NeoForge 26.3 artifact-generation task is not configuration-cache
# compatible yet; keep the release build reliable until upstream fixes that.
org.gradle.configuration-cache=false

minecraft_version=26.3
minecraft_version_range=[26.3]
# v1.1.0 is built on the published NeoForge 26.3 beta line; v1.1.1 moves to
# the first stable NeoForge 26.3 release.
neo_version=26.3.0.45-beta
neo_version_range=[26.3.0.45-beta,)

mod_id=wateroptimisation
mod_name=Water Optimisation
mod_license=MIT
mod_version=1.1.0
mod_group_id=io.github.imcinq.wateroptimisation
