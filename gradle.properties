# Keep the Gradle process bounded in the remote build environment.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties
# Select -Ptarget_minecraft=1.21.11 for the legacy target or 26.3 for the supported stable target.
# Client/API profiles and dependency pins are target-specific;
# the default development target is now 26.3.
target_minecraft=26.3
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.20

# Minecraft 1.21.1 compatibility profile (deprecated; retained during migration)
minecraft_version_1211=1.21.1
loader_version_1211=0.16.13

# Minecraft 1.21.11 v1.0.0 target
minecraft_version_12111=1.21.11
loader_version_12111=0.18.5

# Mod Properties
version=1.1.0
group=io.github.imcinq

# Dependencies
fabric_api_version=0.158.0+26.2
modmenu_version=19.0.0-alpha.1
fabric_api_version_1211=0.116.12+1.21.1
modmenu_version_1211=11.0.4
fabric_api_version_12111=0.141.4+1.21.11
modmenu_version_12111=17.0.1-beta.1

# Fabric 26.3 stable support; existing release versions remain unchanged.
minecraft_version_263=26.3
loader_version_263=0.19.5
fabric_api_version_263=0.160.6+26.3
modmenu_version_263=21.0.0-beta.1
version_263=1.1.0
