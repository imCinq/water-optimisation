# Keep the Gradle process bounded in the remote build environment.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties
# Use -Ptarget_minecraft=1.21.1 in CI or a remote build to select the legacy
# Both 26.2 and 1.21.1 are supported through target-isolated client/API profiles;
# the default remains the current 26.2 target.
target_minecraft=26.2
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.20

# Minecraft 1.21.1 compatibility profile
minecraft_version_1211=1.21.1
loader_version_1211=0.16.13

# Mod Properties
version=0.0.8
group=io.github.imcinq

# Dependencies
fabric_api_version=0.158.0+26.2
modmenu_version=19.0.0-alpha.1
fabric_api_version_1211=0.116.12+1.21.1
modmenu_version_1211=11.0.4
